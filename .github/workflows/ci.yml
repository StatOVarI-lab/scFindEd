name: R tests

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Install all dependencies from DESCRIPTION (Imports/Suggests)
          needs: tests
          # Optionally ensure mockery is present if it's only in tests
          # (make sure mockery is also in Suggests:)
          extra-packages: any::mockery

      - name: Install scFindEd
        run: R CMD INSTALL .

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary")'
