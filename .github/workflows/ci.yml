name: R tests

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::mockery

      - name: Install package
        run: R CMD INSTALL .

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary")'
