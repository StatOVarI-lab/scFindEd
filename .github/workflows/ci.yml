name: R tests

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: tests
          extra-packages: |
            any::devtools
            any::mockery

      # for development purposes, change this when released
      - name: Run tests (devtools::test)
        run: Rscript -e 'devtools::test()'
